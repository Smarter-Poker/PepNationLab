# One-shot, self-deleting workflow: applies the onboarding payment sweep
# patches to three files too large to push whole through the API without
# truncation risk. Every patch asserts its anchor appears exactly once.
# Rev 3: apply-what-you-can - successful patches are committed even when
# another anchor fails; failures are recorded in
# .onboarding-sweep-failures.txt so the reason is readable from the repo.
# Removes itself either way.
name: Apply Onboarding Payment Sweep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-onboarding-payment-sweep.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches with strict assertions
        run: |
          cat > /tmp/patch.py <<'PYEOF'
          failures = []

          def patch(path, old, new, label):
              try:
                  with open(path, encoding='utf-8') as f:
                      src = f.read()
              except OSError as e:
                  failures.append(f"{label}: cannot read {path}: {e}")
                  return
              n = src.count(old)
              if n != 1:
                  failures.append(f"{label}: expected 1 occurrence of anchor in {path}, found {n}")
                  return
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(src.replace(old, new))
              print(f"OK {label}")

          # ---- proxy.ts: exempt the onboarding API from the must-change-password 403 ----
          patch(
              'proxy.ts',
              "  if ((profile as { must_change_password?: boolean } | null)?.must_change_password === true && pathname !== '/account/change-password') {\n",
              "  // Paths that must stay reachable while must_change_password is set:\n"
              "  // /account/change-password is the standalone reset page, and\n"
              "  // /api/agent/onboarding backs the /onboarding wizard, whose FIRST step is\n"
              "  // the in-wizard password change. Without the API exemption a flagged agent\n"
              "  // landing directly on /onboarding got a permanent \"Could Not Load Your\n"
              "  // Setup\" dead end (the wizard's initial GET was 403'd before it could even\n"
              "  // render the password step).\n"
              "  const mustChangePasswordExempt =\n"
              "    pathname === '/account/change-password' || pathname === '/api/agent/onboarding';\n"
              "  if ((profile as { must_change_password?: boolean } | null)?.must_change_password === true && !mustChangePasswordExempt) {\n",
              'proxy-mcp-exemption',
          )

          # ---- OnboardingWizard.tsx: payment step mirrors the server >=1-of-any rule ----
          patch(
              'components/OnboardingWizard.tsx',
              "    if (WIZARD_PAYMENT_METHODS.every((m) => !payload[m.key])) {\n"
              "      setErr('Add At Least One Payment Handle To Continue.');\n"
              "      return;\n"
              "    }\n",
              "    // Mirror the server rule exactly: at least ONE non-empty handle on ANY\n"
              "    // supported method (including ones prefilled from Account Settings, like\n"
              "    // PayPal) satisfies the step. More methods are encouraged, never required.\n"
              "    if (Object.keys(payload).length === 0) {\n"
              "      setErr('Add At Least One Payment Handle To Continue.');\n"
              "      return;\n"
              "    }\n",
              'wizard-payment-check',
          )

          patch(
              'components/OnboardingWizard.tsx',
              '      <StepIntro icon={CreditCard} title="Add Your Payment Methods"\n'
              '        blurb="Researchers Pay You Directly Through These Handles At Checkout. Add At Least One -- You Can Add Or Change The Rest Anytime From Your Dashboard." />\n'
              "      <GuidePanel steps={[\n"
              "        'Fill In The Handle For At Least One Payment Method Below.',\n"
              "        'Double-Check Each Handle - Researchers Send Money Straight To It.',\n"
              "        'Click \"Save And Continue\".',\n"
              "      ]} />\n",
              '      <StepIntro icon={CreditCard} title="Add Your Payment Methods"\n'
              '        blurb="Researchers Pay You Directly Through These Handles At Checkout. Only One Method Is Required To Finish Setup, But Adding More Is Recommended So Every Researcher Can Pay The Way They Prefer." />\n'
              "      <GuidePanel steps={[\n"
              "        'Fill In The Handle For At Least One Payment Method Below. One Is Required.',\n"
              "        'Add More Methods If You Can - More Options Means Fewer Missed Sales.',\n"
              "        'Double-Check Each Handle - Researchers Send Money Straight To It.',\n"
              "        'Click \"Save And Continue\". You Can Add Or Change Methods Anytime From Your Dashboard.',\n"
              "      ]} />\n",
              'wizard-payment-copy',
          )

          # ---- CheckoutForm.tsx: full 10-method support ----
          patch(
              'app/checkout/CheckoutForm.tsx',
              "type PaymentMethodId = 'zelle' | 'cashapp' | 'venmo' | 'apple_pay' | 'apple_cash';\n",
              "type PaymentMethodId = 'zelle' | 'cashapp' | 'venmo' | 'apple_pay' | 'apple_cash' | 'paypal' | 'google_wallet' | 'wise' | 'chime' | 'varo';\n",
              'checkout-type',
          )

          patch(
              'app/checkout/CheckoutForm.tsx',
              '  { id: \'apple_cash\', name: \'Apple Cash\', desc: \'Secure Contactless Flow. Fast Settlement.\', icon: <Image src="/payment-logos/apple_cash.svg" width={40} height={28} alt="Apple Cash" unoptimized style={scaleStyle(1.4)} /> },\n'
              '];\n',
              '  { id: \'apple_cash\', name: \'Apple Cash\', desc: \'Secure Contactless Flow. Fast Settlement.\', icon: <Image src="/payment-logos/apple_cash.svg" width={40} height={28} alt="Apple Cash" unoptimized style={scaleStyle(1.4)} /> },\n'
              '  { id: \'paypal\',        name: \'PayPal\',        desc: \'Send Directly To Your Agent By Email.\', icon: <Image src="/payment-logos/paypal.svg" width={40} height={28} alt="PayPal" unoptimized style={baseStyle} /> },\n'
              '  { id: \'google_wallet\', name: \'Google Wallet\', desc: \'Google Pay Transfer Via Email Or Phone.\', icon: <Image src="/payment-logos/google_wallet.svg" width={40} height={28} alt="Google Wallet" unoptimized style={scaleStyle(1.4)} /> },\n'
              '  { id: \'wise\',          name: \'Wise\',          desc: \'Bank-Linked Transfer By Email.\', icon: <Image src="/payment-logos/wise.svg" width={40} height={28} alt="Wise" unoptimized style={baseStyle} /> },\n'
              '  { id: \'chime\',         name: \'Chime\',         desc: \'Chime Pay Anyone Transfer.\', icon: <Image src="/payment-logos/chime.png" width={40} height={28} alt="Chime" unoptimized style={baseStyle} /> },\n'
              '  { id: \'varo\',          name: \'Varo\',          desc: \'Varo Bank Instant Transfer.\', icon: <Image src="/payment-logos/varo.svg" width={40} height={28} alt="Varo" unoptimized style={baseStyle} /> },\n'
              '];\n'
              '\n'
              'const PAYMENT_METHOD_LABELS: Record<PaymentMethodId, string> = {\n'
              "  zelle: 'Zelle', cashapp: 'Cash App', venmo: 'Venmo', apple_pay: 'Apple Pay', apple_cash: 'Apple Cash',\n"
              "  paypal: 'PayPal', google_wallet: 'Google Wallet', wise: 'Wise', chime: 'Chime', varo: 'Varo',\n"
              '};\n',
              'checkout-methods',
          )

          patch(
              'app/checkout/CheckoutForm.tsx',
              "      case 'apple_cash': return { label: 'Apple Cash Details', handle: handle || noHandle, instructions: handle ? `Send Total Amount Via Apple Cash To: ${handle}. Please Reference Your Order ID.` : 'Contact Your Agent For Apple Cash Payment Instructions.' };\n"
              '      default:',
              "      case 'apple_cash': return { label: 'Apple Cash Details', handle: handle || noHandle, instructions: handle ? `Send Total Amount Via Apple Cash To: ${handle}. Please Reference Your Order ID.` : 'Contact Your Agent For Apple Cash Payment Instructions.' };\n"
              "      case 'paypal': return { label: 'PayPal Details', handle: handle || noHandle, instructions: handle ? `Send Total Amount Via PayPal To: ${handle}. Please Reference Your Order ID In The Note.` : 'Contact Your Agent For PayPal Payment Instructions.' };\n"
              "      case 'google_wallet': return { label: 'Google Wallet Details', handle: handle || noHandle, instructions: handle ? `Send Total Amount Via Google Wallet To: ${handle}. Please Reference Your Order ID.` : 'Contact Your Agent For Google Wallet Payment Instructions.' };\n"
              "      case 'wise': return { label: 'Wise Details', handle: handle || noHandle, instructions: handle ? `Send Total Amount Via Wise To: ${handle}. Please Reference Your Order ID.` : 'Contact Your Agent For Wise Payment Instructions.' };\n"
              "      case 'chime': return { label: 'Chime Details', handle: handle || noHandle, instructions: handle ? `Send Total Amount Via Chime To: ${handle}. Please Reference Your Order ID.` : 'Contact Your Agent For Chime Payment Instructions.' };\n"
              "      case 'varo': return { label: 'Varo Details', handle: handle || noHandle, instructions: handle ? `Send Total Amount Via Varo To: ${handle}. Please Reference Your Order ID.` : 'Contact Your Agent For Varo Payment Instructions.' };\n"
              '      default:',
              'checkout-payment-details',
          )

          patch(
              'app/checkout/CheckoutForm.tsx',
              "              <strong style={{ color: 'var(--white)', fontSize: '0.95rem' }}>{paymentMethod === 'cashapp' ? 'Cash App'\n"
              "                  : paymentMethod === 'apple_cash' ? 'Apple Cash'\n"
              "                  : paymentMethod === 'apple_pay' ? 'Apple Pay'\n"
              "                  : paymentMethod === 'venmo' ? 'Venmo'\n"
              "                  : paymentMethod === 'zelle' ? 'Zelle'\n"
              "                  : paymentMethod}</strong>\n",
              "              <strong style={{ color: 'var(--white)', fontSize: '0.95rem' }}>{PAYMENT_METHOD_LABELS[paymentMethod] ?? paymentMethod}</strong>\n",
              'checkout-success-label',
          )

          if failures:
              with open('.onboarding-sweep-failures.txt', 'w', encoding='utf-8') as f:
                  f.write('Onboarding Payment Sweep Patch Failures\n')
                  for line in failures:
                      f.write(line + '\n')
              print('FAILURES RECORDED (successful patches still committed)')
          else:
              print('All patches applied.')
          PYEOF
          python3 /tmp/patch.py
      - name: Commit result, remove workflow, push
        run: |
          git config user.name "onboarding-sweep-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/apply-onboarding-payment-sweep.yml
          git add app/checkout/CheckoutForm.tsx components/OnboardingWizard.tsx proxy.ts
          if [ -f .onboarding-sweep-failures.txt ]; then git add .onboarding-sweep-failures.txt; fi
          git commit -m "fix(onboarding): checkout 10-method support, wizard one-method rule copy, onboarding API reachable while password-flagged (one-shot, self-removed)"
          git pull --rebase origin main
          git push origin main
