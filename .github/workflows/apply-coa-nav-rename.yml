# One-shot, self-deleting workflow: renames the admin sidebar (hamburger) nav
# item for the Certificate Of Analysis manager from "Certificates Of Analysis"
# to "COA's". Asserts the anchor is present exactly once; aborts without
# committing otherwise. Removes itself.
name: Apply COA Nav Rename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-coa-nav-rename.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rename nav label with assertion
        run: |
          echo '' | base64 -d > /tmp/rename_coa.js
          node /tmp/rename_coa.js
      - name: Commit, remove workflow, push
        run: |
          git config user.name "coa-nav-rename-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/apply-coa-nav-rename.yml
          git add app/admin/AdminLayoutClient.tsx
          git commit -m "feat(admin): rename COA nav item to COA's (one-shot, self-removed)"
          git pull --rebase origin main
          git push origin main
