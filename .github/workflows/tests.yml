name: Tests

on:
  pull_request:
    paths:
      - '__tests__/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - '__tests__/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/tests.yml'

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Vitest
        run: npm test
