# One-shot, self-deleting workflow: migrate house-store-scoped agent API
# routes from requireAgent to requireAgentOrAdmin so the ADMIN can use the
# agent dashboard surfaces (Storefront Config, Inventory, Bundles, Coupons,
# Sales, Researchers CRM) on the house store without 403s - the same bug
# class as the Product Manager fix. Every migrated route scopes all queries
# to agent_id = caller id. Strict per-file assertions: any mismatch aborts
# the job WITHOUT committing. Applied and tsc-verified locally first.

name: Apply Agent Route Gate Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gate-migration.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply gate swaps with assertions
        run: |
          cat > /tmp/gate-swap.js <<'SWAP_EOF'
          // One-shot gate migration: requireAgent -> requireAgentOrAdmin on
          // house-store-scoped agent routes (every query in these files is scoped to
          // agent_id = caller id, so an admin can only touch the house store's own
          // rows). Excluded on purpose: orders/*, shipping/*, sub-agents/*,
          // super-agent/*, agents/*, promote/revoke-subagent, freeze, tier,
          // commission, statements, onboarding, wallet pay/auto-pay/credit-increase/
          // 1099, credits/send - those either write order costs with tier math or
          // carry cross-agent semantics, and the admin has native /admin/* pages for
          // them.
          const fs = require('fs');

          const FILES = [
            'app/api/agent/bundles/route.ts',
            'app/api/agent/inventory/reorder/route.ts',
            'app/api/agent/me/route.ts',
            'app/api/agent/storefront-slug/route.ts',
            'app/api/agent/storefront-slug/check/route.ts',
            'app/api/agent/storefront-name/route.ts',
            'app/api/agent/storefront/theme/route.ts',
            'app/api/agent/storefront/domains/route.ts',
            'app/api/agent/storefront/domains/[id]/route.ts',
            'app/api/agent/storefront-config/shippo-key/route.ts',
            'app/api/agent/coupons/route.ts',
            'app/api/agent/coupons/[id]/route.ts',
            'app/api/agent/coupons/[id]/qr/route.ts',
            'app/api/agent/coupons/[id]/redemptions/route.ts',
            'app/api/agent/coupons/[id]/notify-downline/route.ts',
            'app/api/agent/coupons/bulk/route.ts',
            'app/api/agent/coupons/performance/route.ts',
            'app/api/agent/sales/route.ts',
            'app/api/agent/sales/insights/route.ts',
            'app/api/agent/sales/insights-v2/route.ts',
            'app/api/agent/sales/kpis-v2/route.ts',
            'app/api/agent/sales/timeseries-v2/route.ts',
            'app/api/agent/sales/heatmap/route.ts',
            'app/api/agent/sales/ai-summary/route.ts',
            'app/api/agent/sales/export/tax/route.ts',
            'app/api/agent/researchers/route.ts',
            'app/api/agent/researchers/v2/route.ts',
            'app/api/agent/researchers/crm/route.ts',
            'app/api/agent/researchers/insights/route.ts',
            'app/api/agent/researchers/notes/route.ts',
            'app/api/agent/researchers/pins/route.ts',
            'app/api/agent/researchers/tags/route.ts',
            'app/api/agent/researchers/reminders/route.ts',
            'app/api/agent/researchers/goals/route.ts',
            'app/api/agent/researchers/export/route.ts',
            'app/api/agent/researchers/contact/route.ts',
            'app/api/agent/wallet/commissions/route.ts',
            'app/api/agent/inventory/route.ts',
          ];

          function fail(msg) {
            console.error('ASSERTION FAILED: ' + msg);
            process.exit(1);
          }

          // 1. Special case FIRST: inventory GET must use base_cost for admin sessions
          // (same pattern as products/route.ts), applied against the original content.
          {
            const f = 'app/api/agent/inventory/route.ts';
            let s = fs.readFileSync(f, 'utf8');
            const from = [
              '      let agentCost = 0;',
              '      if (baseCost > 0) {',
              '        agentCost = await computeAgentCostForAgent(supabase, p.id, agentId, tier);',
              '      }',
            ].join('\n');
            const to = [
              '      // Admin cost basis is base_cost (true COGS on the house store);',
              '      // agents get their tier-multiplied cost.',
              '      let agentCost = 0;',
              '      if (baseCost > 0) {',
              '        agentCost = gate.isAdmin',
              '          ? baseCost',
              '          : await computeAgentCostForAgent(supabase, p.id, agentId, tier);',
              '      }',
            ].join('\n');
            const parts = s.split(from);
            if (parts.length - 1 !== 1) fail(f + ' cost block: expected 1 occurrence, found ' + (parts.length - 1));
            fs.writeFileSync(f, parts.join(to));
            console.log('OK inventory cost branch');
          }

          // 2. Token swap requireAgent -> requireAgentOrAdmin per file, with assertions.
          for (const f of FILES) {
            let s = fs.readFileSync(f, 'utf8');
            if (s.includes('requireAgentOrAdmin')) fail(f + ' already migrated');
            if (s.includes('requireAdmin')) fail(f + ' also references requireAdmin - needs manual review');
            const count = s.split('requireAgent').length - 1;
            if (count < 2) fail(f + ' expected >=2 requireAgent tokens (import + call), found ' + count);
            s = s.split('requireAgent').join('requireAgentOrAdmin');
            fs.writeFileSync(f, s);
            console.log('OK (' + count + 'x): ' + f);
          }

          console.log('All gate swaps applied to ' + FILES.length + ' files.');

          SWAP_EOF
          node /tmp/gate-swap.js

      - name: Commit, remove this workflow, push
        run: |
          git config user.name 'gate-migration-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/workflows/apply-gate-migration.yml
          git add app/api/agent
          git commit -m 'Migrate house-store-scoped agent routes to requireAgentOrAdmin

          Fixes the Product Manager bug class across the rest of the agent
          dashboard: the admin sidebar and Overview tiles funnel the admin
          into Storefront Config, Inventory, Bundles, Coupons, Sales, and
          Researchers CRM, but every backing /api/agent route used
          requireAgent (admin 403). All 38 migrated routes scope queries to
          agent_id = caller id, so the admin can only touch the house store.
          Inventory GET now uses base_cost as the admin cost basis (same as
          the products routes). Deliberately NOT migrated: orders/*,
          shipping/*, sub-agents/*, super-agent/*, agents/*,
          promote/revoke-subagent, wallet pay/credit routes - cross-agent
          semantics or tier-cost order writes; admin has native /admin pages.'
          git pull --rebase origin main
          git push origin main
