name: SEO Apply (self-deleting)

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: seo-apply

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode manifest
        env:
          MANIFEST_B64: ""
        run: |
          echo "$MANIFEST_B64" | base64 -d | gunzip > /tmp/m.json
          echo "2f83aeaad13440ac2f01bc22569a44c29fb2eb38fe50116c7175632085f9af8a  /tmp/m.json" | sha256sum -c -

      - name: Write files and assert
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const m = JSON.parse(fs.readFileSync('/tmp/m.json', 'utf8'));
            const entries = Object.entries(m.files);
            for (const [p, b64] of entries) {
              const buf = Buffer.from(b64, 'base64');
              fs.mkdirSync(path.dirname(p), { recursive: true });
              fs.writeFileSync(p, buf);
              console.log('wrote ' + p + ' (' + buf.length + ' bytes)');
            }
            const agentPath = 'app/[agentSlug]/page.tsx';
            const cityPath = 'app/peptides/[stateSlug]/[citySlug]/page.tsx';
            const agent = fs.readFileSync(agentPath, 'utf8');
            const city = fs.readFileSync(cityPath, 'utf8');
            let ok = true;
            function check(cond, msg) { if (!cond) { console.error('ASSERT FAIL: ' + msg); ok = false; } else { console.log('ok: ' + msg); } }
            check(agent.includes('if (!name) return null'), 'agent includes if (!name) return null');
            check(city.includes("String(p.name || '').trim() !== ''"), 'city includes name trim guard');
            check(agent.includes("'@type': 'Product'"), 'agent includes Product type');
            check(city.includes("'@type': 'Product'"), 'city includes Product type');
            if (!ok) { process.exit(1); }

      - name: Commit, self-delete, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/seo-apply.yml
          git add -A
          git commit -m "fix(seo): Product structured data always includes required name; guard offers; skip nameless products"
          for i in 1 2 3 4 5; do
            git push origin main && break || git pull --rebase -X ours origin main
          done
