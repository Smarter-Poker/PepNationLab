name: Repair Part05
on:
  push:
    branches: [main]
    paths:
      - '.repair/trigger-part05.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Part05 Literal
        run: |
          python3 -c "import pathlib; bs=chr(92); p=pathlib.Path('.repair/comparetool/part05.txt'); s=p.read_text(encoding='utf-8'); s=s.replace(bs+bs+'u2605 TOP PICK', bs+'u2605 TOP PICK'); s=s.replace(chr(0x2605)+' TOP PICK', bs+'u2605 TOP PICK'); p.write_text(s, encoding='utf-8')"
          test "$(git hash-object .repair/comparetool/part05.txt)" = "ae6edbbe38b16db7d25ab3a6c60d4909e1c714cd"
      - name: Commit And Push
        run: |
          git config user.name "repair-bot"
          git config user.email "repair-bot@users.noreply.github.com"
          git add .repair/comparetool/part05.txt
          git rm -f --ignore-unmatch .repair/trigger-part05.txt .repair/comparetool/probe-delete-me.txt .github/workflows/repair-part05.yml
          git commit -m "repair: comparetool part part05"
          git push
