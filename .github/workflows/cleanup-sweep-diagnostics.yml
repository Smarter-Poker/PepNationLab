# One-shot, self-deleting workflow: removes the stale (false alarm)
# .onboarding-sweep-failures.txt left by a duplicate sweep run that executed
# after the patches had already been applied by an earlier queued run.
name: Cleanup Sweep Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-sweep-diagnostics.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove diagnostics file and this workflow, push
        run: |
          git config user.name "onboarding-sweep-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch .onboarding-sweep-failures.txt
          git rm -q .github/workflows/cleanup-sweep-diagnostics.yml
          git commit -m "chore: remove stale onboarding sweep diagnostics (one-shot, self-removed)"
          git pull --rebase origin main
          git push origin main
