# One-shot, self-deleting workflow: changes the certificate's default storage
# instruction from the freezer temp ("Store At Minus 4 F") to the refrigerated
# range ("Store At 36 To 46 F"). Asserts the anchor is present exactly once and
# the replacement landed; aborts without committing otherwise. Removes itself.
name: Apply COA Storage Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-coa-storage-temp.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Replace storage default with assertions
        run: |
          F=components/coa/CertificateDocument.tsx
          N=$(grep -c 'Store At Minus 4 F' "$F" || true)
          if [ "$N" != "1" ]; then echo "ASSERT FAIL: expected 1 anchor, found $N"; exit 1; fi
          sed -i 's/Store At Minus 4 F/Store At 36 To 46 F/' "$F"
          grep -q 'Store At 36 To 46 F' "$F" || { echo "ASSERT FAIL: replacement not found"; exit 1; }
          echo "OK: storage default is now the refrigerated range"
      - name: Commit, remove workflow, push
        run: |
          git config user.name "coa-storage-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/apply-coa-storage-temp.yml
          git add components/coa/CertificateDocument.tsx
          git commit -m "fix(coa): default storage to refrigerated range 36 To 46 F (one-shot, self-removed)"
          git pull --rebase origin main
          git push origin main
