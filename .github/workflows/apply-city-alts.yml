# One-shot, self-deleting workflow: city template - hide the At A Glance
# fact box (answer-engine content stays in the HTML) and embed city,
# compound, and popular names into image alt attributes for image SEO.
# Assertion-guarded: aborts without committing on any mismatch.

name: Apply City Template Alt SEO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-city-alts.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply replacements with assertions
        run: |
          cat > /tmp/city-alts.js <<'CA_EOF'
          const fs = require('fs');
          const FILE = 'app/peptides/[stateSlug]/[citySlug]/CityPage.tsx';
          let s = fs.readFileSync(FILE, 'utf8');
          function rep(from, to, expected) {
            const parts = s.split(from);
            if (parts.length - 1 !== expected) { console.error('ASSERTION FAILED (' + (parts.length - 1) + ' vs ' + expected + '): ' + JSON.stringify(from.slice(0, 90))); process.exit(1); }
            s = parts.join(to);
            console.log('OK: ' + JSON.stringify(from.slice(0, 55)));
          }
          // 1. Hide the At A Glance fact box (answer-engine bait stays in the HTML).
          rep(
            "        <section style={{ position: 'relative', padding: 'clamp(40px, 5vw, 64px) 0', borderTop: '1px solid rgba(255,255,255,0.05)', overflow: 'hidden' }}>",
            [
              '        {/* Visually hidden (clip-rect) but fully present in the HTML and',
              '            accessibility tree. This dense fact block is answer-engine bait -',
              '            AI assistants and featured snippets quote exactly this kind of',
              '            self-contained factual content - but it read as a generic text',
              '            glob on the visible page. Do not remove; hide-only. */}',
              "        <section aria-label={`${city.name} Research Supply Facts`} style={{ position: 'absolute', width: 1, height: 1, padding: 0, margin: -1, overflow: 'hidden', clip: 'rect(0, 0, 0, 0)', whiteSpace: 'nowrap', border: 0 }}>",
            ].join('\n'),
            1
          );
          // 2. Hero image: city-specific keyword-rich alt instead of the generic one.
          rep(
            '<Image src="/images/city-hero-peptide.jpg" alt="3D peptide helix" fill priority',
            '<Image src="/images/city-hero-peptide.jpg" alt={`Research Peptides In ${city.name}, ${city.state}${city.county ? ` - ${city.county} County` : \x27\x27} - Research-Grade Peptide Supply For Verified Researchers`} fill priority',
            1
          );
          // 3. Top-10 product card images: embed compound name, popular name, size,
          //    and city into the alt attribute for image SEO.
          rep(
            '                        alt={card.name}',
            '                        alt={`${card.name}${card.subtitle ? ` (${card.subtitle})` : \x27\x27} Research Peptide ${card.sizeLabel} - Available To Researchers In ${city.name}, ${city.stateAbbr}`}',
            1
          );
          fs.writeFileSync(FILE, s);
          console.log('Done.');

          CA_EOF
          node /tmp/city-alts.js

      - name: Commit, remove this workflow, push
        run: |
          git config user.name 'seo-layers-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/workflows/apply-city-alts.yml
          git add 'app/peptides/[stateSlug]/[citySlug]/CityPage.tsx'
          git commit -m 'City template: hide At A Glance box, embed SEO data in image alts

          The At A Glance fact block exists as answer-engine bait (dense,
          quotable, self-contained facts) but read as a generic text glob on
          the visible page - now clip-rect hidden while staying fully present
          in the HTML for crawlers and AI assistants. The hero image and all
          ten Top-10 product card images now carry keyword-rich alt text
          embedding the compound name, popular name, vial size, city, and
          state - alt attributes are how Google Images and page relevance
          scoring read images.'
          git pull --rebase origin main
          git push origin main
