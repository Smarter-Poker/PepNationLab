# One-shot, self-deleting workflow: site-wide SEO layer pass.
# Hides the three remaining VISIBLE seo-content blocks (home, monographs,
# compare hub) with the standard clip-rect pattern, adds hidden crawlable
# content layers to the three client-rendered pages that had none
# (/researchstore, /find-a-peptide, /peptide-101), and noindexes the
# internal /shipping tool. Every hidden layer mirrors the visible UI
# (equivalent content, not keyword stuffing). Assertion-guarded: aborts
# without committing on any mismatch. Applied and tsc-verified locally.

name: Apply Site-Wide SEO Layers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-seo-layers.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply SEO layer operations with assertions
        run: |
          cat > /tmp/seo-layers.js <<'SEO_EOF'
          // Site-wide SEO layer pass:
          //  1-3. Hide the three VISIBLE seo-content blocks (home, monographs, compare)
          //       with the standard clip-rect pattern - content stays in the HTML.
          //  4-6. Add hidden crawlable content layers to the three client-rendered
          //       pages that had none: /researchstore, /find-a-peptide, /peptide-101.
          //  7.   Noindex the internal /shipping fulfillment tool.
          // Every hidden layer mirrors what the page visually presents - equivalent
          // content for JS-rendered UIs, never detached keyword lists.
          const fs = require('fs');
          function fail(m) { console.error('ASSERTION FAILED: ' + m); process.exit(1); }
          function rep(file, from, to, expected) {
            let s = fs.readFileSync(file, 'utf8');
            const parts = s.split(from);
            if (parts.length - 1 !== expected) fail(file + ': expected ' + expected + ', found ' + (parts.length - 1) + ' for ' + JSON.stringify(from.slice(0, 70)));
            fs.writeFileSync(file, parts.join(to));
            console.log('OK: ' + file);
          }
          const CLIP = [
            "      // Visually hidden, crawler- and screen-reader-accessible (standard",
            "      // clip-rect pattern used site-wide). This block is the no-JS",
            "      // equivalent of what the interactive UI renders, kept in the initial",
            "      // HTML so search engines and AI crawlers can read it. It mirrors the",
            "      // visible page content - NOT hidden keyword stuffing. Do not remove.",
            "      style={{",
            "        position: 'absolute',",
            "        width: 1,",
            "        height: 1,",
            "        padding: 0,",
            "        margin: -1,",
            "        overflow: 'hidden',",
            "        clip: 'rect(0, 0, 0, 0)',",
            "        whiteSpace: 'nowrap',",
            "        border: 0,",
            "      }}",
          ].join('\n');

          // 1. Homepage HomeSeoContent - hide the visible section (duplicate H1 fix).
          rep('components/HomeSeoContent.tsx', [
            "    <section",
            "      aria-label=\"About Pep Nation Lab\"",
            "      style={{",
            "        background: '#020617',",
            "        color: 'var(--white, #fff)',",
            "        padding: 'var(--space-8, 48px) var(--space-4, 16px)',",
            "      }}",
            "    >",
          ].join('\n'), [
            "    <section",
            "      aria-label=\"About Pep Nation Lab\"",
            CLIP,
            "    >",
          ].join('\n'), 1);

          // 2. Monograph pages - hide the visible article block above the tabs.
          rep('components/research/MonographSeoContent.tsx', [
            "    <article",
            "      aria-label={`${compound.display_name} Research Summary`}",
            "      style={{",
            "        maxWidth: '1100px',",
            "        margin: '0 auto',",
            "        padding: 'var(--space-6, 32px) var(--space-4, 16px) var(--space-2, 8px)',",
            "        color: 'var(--white, #fff)',",
            "      }}",
            "    >",
          ].join('\n'), [
            "    <article",
            "      aria-label={`${compound.display_name} Research Summary`}",
            CLIP,
            "    >",
          ].join('\n'), 1);

          // 3. Compare hub - hide the visible links/FAQ block below the tool.
          rep('components/research/CompareSeoContent.tsx', [
            "    <section",
            "      aria-label=\"About The Compound Comparison Tool\"",
            "      style={{ maxWidth: 1200, margin: '48px auto 0', padding: '0 var(--space-4, 16px) var(--space-8, 48px)', color: 'var(--white, #fff)' }}",
            "    >",
          ].join('\n'), [
            "    <section",
            "      aria-label=\"About The Compound Comparison Tool\"",
            CLIP,
            "    >",
          ].join('\n'), 1);

          // 4. /researchstore - add crawlable storefront layer (page had zero prose).
          rep('app/[agentSlug]/page.tsx', [
            "      {/* Products */}",
            "      <section style={{ paddingTop: 8, paddingBottom: 24, position: 'relative', minHeight: '60vh' }}>",
          ].join('\n'), [
            "      {/* Crawlable storefront content layer - visually hidden (clip-rect),",
            "          present in the initial HTML for search engines and AI crawlers.",
            "          The product grid streams client-side inside Suspense, so without",
            "          this the only indexable storefront has no crawlable prose. */}",
            "      <header style={{ position: 'absolute', width: 1, height: 1, padding: 0, margin: -1, overflow: 'hidden', clip: 'rect(0, 0, 0, 0)', whiteSpace: 'nowrap', border: 0 }}>",
            "        <h1>{agent.display_name} - Buy Research Peptides Online At Wholesale Pricing</h1>",
            "        <p>",
            "          Browse 100+ Research-Grade Peptides And Compounds Including BPC-157, TB-500, Semaglutide,",
            "          Tirzepatide, Retatrutide, Cagrilintide, CJC-1295, Ipamorelin, Sermorelin, GHK-Cu, PT-141,",
            "          NAD+, And Research Peptide Stacks. Every Vial Is Batch-Tested With Certificate Of Analysis",
            "          Documentation And Ships Same-Day Nationwide To Verified Researchers At True Wholesale",
            "          Pricing. All Products Are Strictly For In Vitro Laboratory Research Use Only - Not For",
            "          Human Consumption.",
            "        </p>",
            "        <nav aria-label=\"Research Resources\">",
            "          <a href=\"/research\">Peptide Research Library</a>",
            "          <a href=\"/find-a-peptide\">Find A Peptide By Research Goal</a>",
            "          <a href=\"/peptides\">Research Peptides By City</a>",
            "          <a href=\"/peptide-101\">Peptide 101 Research Education</a>",
            "          <a href=\"/become-agent\">Become A Peptide Distribution Agent</a>",
            "        </nav>",
            "      </header>",
            "",
            "      {/* Products */}",
            "      <section style={{ paddingTop: 8, paddingBottom: 24, position: 'relative', minHeight: '60vh' }}>",
          ].join('\n'), 1);

          // 5. /find-a-peptide - add crawlable finder layer.
          rep('app/find-a-peptide/page.tsx', [
            "      <div style={{ paddingTop: '60px', minHeight: '100dvh', backgroundColor: '#05070a' }}>",
            "        <FindAPeptideClient",
          ].join('\n'), [
            "      <div style={{ paddingTop: '60px', minHeight: '100dvh', backgroundColor: '#05070a' }}>",
            "        {/* Crawlable finder content layer - visually hidden (clip-rect).",
            "            The finder itself is client-rendered, so this is the no-JS",
            "            equivalent for search engines and AI crawlers. */}",
            "        <header style={{ position: 'absolute', width: 1, height: 1, padding: 0, margin: -1, overflow: 'hidden', clip: 'rect(0, 0, 0, 0)', whiteSpace: 'nowrap', border: 0 }}>",
            "          <h1>Find A Peptide - Match Research Compounds To Your Research Goal</h1>",
            "          <p>",
            "            Discover The Right Research Peptide By Therapeutic Research Area: Weight Loss And",
            "            Metabolism Research (Semaglutide, Tirzepatide, Retatrutide, AOD9604), Healing And",
            "            Recovery (BPC-157, TB-500), Anti-Aging And Longevity (Epithalon, NAD+, GHK-Cu),",
            "            Muscle Growth And Performance (CJC-1295, Ipamorelin, Sermorelin), Skin And Cosmetic",
            "            Research, Immunity And Wellness, And Sexual Health. Answer A Few Questions And The",
            "            Match Engine Recommends Citation-Backed Compounds For In Vitro Laboratory Research.",
            "            Research Use Only - Not For Human Consumption.",
            "          </p>",
            "          <nav aria-label=\"Finder Resources\">",
            "            <a href=\"/research/areas\">Browse By Research Area</a>",
            "            <a href=\"/research/match\">AI Match Engine</a>",
            "            <a href=\"/research/catalog\">Full Compound Catalog</a>",
            "            <a href=\"/research\">Peptide Research Library</a>",
            "          </nav>",
            "        </header>",
            "        <FindAPeptideClient",
          ].join('\n'), 1);

          // 6. /peptide-101 - the page is client-rendered and BLANK pre-hydration;
          //    the server layout gets the crawlable course outline.
          rep('app/peptide-101/layout.tsx', [
            "        dangerouslySetInnerHTML={{ __html: JSON.stringify(courseJsonLd) }}",
            "      />",
            "      {children}",
          ].join('\n'), [
            "        dangerouslySetInnerHTML={{ __html: JSON.stringify(courseJsonLd) }}",
            "      />",
            "      {/* Crawlable course content layer - visually hidden (clip-rect).",
            "          The Peptide 101 page is fully client-rendered and blank before",
            "          hydration, so this layer is the no-JS equivalent for crawlers. */}",
            "      <section aria-label=\"Peptide 101 Course Overview\" style={{ position: 'absolute', width: 1, height: 1, padding: 0, margin: -1, overflow: 'hidden', clip: 'rect(0, 0, 0, 0)', whiteSpace: 'nowrap', border: 0 }}>",
            "        <h1>Peptide 101 - Free Research Peptide Education Course</h1>",
            "        <p>",
            "          Peptide 101 Is A Free Interactive Education Course For New Peptide Researchers. Learn",
            "          What Research Peptides Are And How They Work, How To Reconstitute Peptides With",
            "          Bacteriostatic Water, Proper Peptide Storage And Handling, How To Read A Certificate",
            "          Of Analysis And Verify Purity, Peptide Evidence Tiers And Research Literacy, And How",
            "          To Navigate The Research Peptide Landscape Safely And Compliantly. All Content Is For",
            "          In Vitro Laboratory Research Education Only - Not Medical Advice.",
            "        </p>",
            "        <nav aria-label=\"Course Resources\">",
            "          <a href=\"/research\">Peptide Research Library</a>",
            "          <a href=\"/research/calculators\">Reconstitution Calculators</a>",
            "          <a href=\"/research/glossary\">Peptide Science Glossary</a>",
            "          <a href=\"/research/guides\">Research Guides</a>",
            "          <a href=\"/research/faq\">Research Library FAQ</a>",
            "        </nav>",
            "      </section>",
            "      {children}",
          ].join('\n'), 1);

          // 7. /shipping is an internal fulfillment tool - keep it out of the index.
          fs.writeFileSync('app/shipping/layout.tsx', [
            "import type { Metadata } from 'next';",
            "",
            "// The shipping page is an internal fulfillment tool (packing slips, label",
            "// purchase) - it must never appear in search results. The page itself is a",
            "// client component and cannot export metadata, so the noindex lives here.",
            "export const metadata: Metadata = {",
            "  title: 'Shipping | Pep Nation Lab',",
            "  robots: { index: false, follow: false },",
            "};",
            "",
            "export default function ShippingLayout({ children }: { children: React.ReactNode }) {",
            "  return children;",
            "}",
            "",
          ].join('\n'));
          console.log('OK: app/shipping/layout.tsx (created)');
          console.log('All 7 SEO layer operations applied.');

          SEO_EOF
          node /tmp/seo-layers.js

      - name: Commit, remove this workflow, push
        run: |
          git config user.name 'seo-layers-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/workflows/apply-seo-layers.yml
          git add components/HomeSeoContent.tsx components/research/MonographSeoContent.tsx components/research/CompareSeoContent.tsx 'app/[agentSlug]/page.tsx' app/find-a-peptide/page.tsx app/peptide-101/layout.tsx app/shipping/layout.tsx
          git commit -m 'Site-wide SEO layer pass: hide visible blocks, add missing crawlable layers

          Audit of every public page found three VISIBLE seo-content blocks
          duplicating interactive UI (homepage HomeSeoContent, monograph
          MonographSeoContent, compare hub CompareSeoContent) - all now use
          the standard clip-rect hidden pattern, fixing the duplicate-H1 on
          the homepage. Three high-value client-rendered pages had ZERO
          crawlable content and now carry hidden equivalent-content layers
          with H1, keyword-rich intro, and internal links: /researchstore
          (the only indexable storefront - products stream client-side),
          /find-a-peptide, and /peptide-101 (which was fully blank before
          hydration). The internal /shipping fulfillment tool is now
          noindexed via a new server layout. All hidden layers mirror what
          each page visually presents.'
          git pull --rebase origin main
          git push origin main
