name: apply-cowork-guest-cart

on:
  push:
    paths:
      - '.github/workflows/apply-cowork-guest-cart.yml'

permissions:
  contents: write

concurrency:
  group: apply-cowork-guest-cart
  cancel-in-progress: false

env:
  PATCH_SHA: 2678aab372a70c46cf967f45359176a76eb4f7986b62ab6506fd5a5819e9c9c9
  PATCH_B64: 

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Decode + verify integrity
        run: |
          set -euo pipefail
          echo "$PATCH_B64" | base64 -d | gunzip > /tmp/guest.patch
          echo "${PATCH_SHA}  /tmp/guest.patch" | sha256sum -c -
          grep '^diff --git' /tmp/guest.patch

      - name: Verify applies cleanly (abort if not)
        run: git apply --check /tmp/guest.patch

      - name: Apply
        run: git apply /tmp/guest.patch

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Typecheck gate
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npx tsc --noEmit

      - name: Commit, self-delete, push
        run: |
          set -euo pipefail
          git config user.name "cowork-guest-cart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/apply-cowork-guest-cart.yml
          git add -A
          git commit -m "fix(conversion): carry the agent slug from GuestCTA -> signup -> checkout so guest carts survive

Applied by the one-shot workflow (now removed). A guest browsing an AGENT
storefront can build a cart stored at pnl_storefront_cart_<slug>. GuestCTA's
cart-aware mode routed them to a bare /checkout, dropping the slug. Checkout loads
the cart from pnl_storefront_cart_<agentSlug>, resolving the slug from ?agent= or
the researcher's referring_agent_id -- but /signup links every account to the HOUSE
store, so on an agent storefront the referring_agent_id never matches the cart key
and the cart is empty. GuestCTA's own comment promised 'nothing is lost'; for
agent-storefront guests (the core business) it was.

- GuestCTA captures the slug from the pnl_storefront_cart_<slug> key it already
  scans and routes cart-having grid guests to /checkout?agent=<slug>. CartContext
  carts still route to bare /checkout (read directly there).
- signup OAuth path appends the registration-ack flag with & when redirectTo
  already has a query, so /checkout?agent=slug does not become a double-? URL that
  corrupts the agent param and drops the compliance ack. The email/password path
  used window.location.replace(redirectTo) verbatim, so it was unaffected.

Round-trip verified: signup?redirect=%2Fcheckout%3Fagent%3Dslug -> /checkout?agent=slug
(passes open-redirect guard, agent valid); OAuth callback yields
...?agent=slug&ack=registration with both params intact."
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo pushed; break; fi
            git fetch origin main; git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 3
          done
