name: apply-cowork-funnel-cart

on:
  push:
    paths:
      - '.github/workflows/apply-cowork-funnel-cart.yml'

permissions:
  contents: write

concurrency:
  group: apply-cowork-funnel-cart
  cancel-in-progress: false

env:
  PATCH_SHA: 96f3d7e215cd48da13688786d9513caa8f0c05edb4e0170eabc8c3289e376f68
  PATCH_B64: 

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Decode patch and verify integrity
        run: |
          set -euo pipefail
          echo "$PATCH_B64" | base64 -d | gunzip > /tmp/cowork.patch
          echo "${PATCH_SHA}  /tmp/cowork.patch" | sha256sum -c -
          echo "--- patch summary ---"
          grep '^diff --git' /tmp/cowork.patch

      - name: Verify patch applies cleanly (abort if not)
        run: git apply --check /tmp/cowork.patch

      - name: Apply patch
        run: git apply /tmp/cowork.patch

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Typecheck gate
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npx tsc --noEmit

      - name: Commit, self-delete, push
        run: |
          set -euo pipefail
          git config user.name "cowork-funnel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/apply-cowork-funnel-cart.yml
          git add -A
          git commit -m "fix(analytics+cart): emit the funnel events the dashboard charts; restore saved carts

Applied by the one-shot workflow (now removed). AgentStorefrontGrid.tsx and
CartContext.tsx are too large to round-trip through the API-only agent channel,
so the change was applied on the runner from an integrity-checked patch behind a
git-apply and typecheck gate.

1) Funnel events. /dashboard/agent/analytics charts a conversion funnel from the
   agent_storefront_analytics_30d view, which counts add_to_cart_30d as
   COUNT(*) FILTER (WHERE event_type = 'add_to_cart'). Nothing ever emitted that
   event, so every agent saw a permanent 0 at the most important step; production
   agent_storefront_events held only 'pageview' rows. Wires add_to_cart,
   product_view and search (the route and table already accepted all six types).
   The stock cap stays authoritative inside the setState updater; the analytics
   decision reads a ref, because React invokes updaters during render so a flag
   set inside one is not readable afterwards. Deletes lib/storefront-events.ts,
   a dead duplicate of lib/track.ts imported nowhere.

2) Cart restore. cart_state was write-only: the client POSTed it and the reminder
   crons read it, but nothing handed it back, so the abandoned-cart email landed
   the researcher on an empty cart. Worse, CartContext hydrated an empty cart from
   localStorage and immediately POSTed [], overwriting the saved cart_state --
   destroying it and silencing the reminder cron, which filters cart_state <> '[]'.
   Production: 7 researchers had carts, 0 saved carts survived, 8 were wiped to [].
   Adds GET /api/cart/sync (auth-required, rate-limited) and restores from it on
   mount, adopting the server cart only when the local cart is empty, with the
   persist POST gated behind serverCartChecked so an empty cart can no longer race
   ahead and wipe it. No disclaimer gate is touched: restoring a previously
   acknowledged cart is not a new add-to-cart action, and the checkout gate still
   applies."
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "pushed"; break; fi
            echo "push rejected, rebasing (attempt $i)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 3
          done
