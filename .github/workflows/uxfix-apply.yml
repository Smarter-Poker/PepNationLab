name: uxfix-apply
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: uxfix-apply
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode manifest
        env:
          MANIFEST_B64: 
        run: echo "$MANIFEST_B64" | base64 -d > /tmp/m.json
      - name: Write files
        run: |
          node <<'NODEEOF'
          const fs = require('fs');
          const path = require('path');
          const m = JSON.parse(fs.readFileSync('/tmp/m.json', 'utf8'));
          for (const [p, b64] of Object.entries(m.files)) {
            const buf = Buffer.from(b64, 'base64');
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, buf);
            console.log('wrote', p, buf.length, 'bytes');
          }
          const prof = fs.readFileSync('lib/profile-utils.ts', 'utf8');
          const notif = fs.readFileSync('components/FirstRunNotificationPrompt.tsx', 'utf8');
          const ok = prof.includes('hasRealEmail') && prof.includes('contact_email')
            && notif.includes('Notifications Are Blocked') && notif.includes('BellOff');
          if (!ok) { console.error('ASSERTION FAILED'); process.exit(1); }
          console.log('assertions passed');
          NODEEOF
      - name: Commit, self-delete, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/uxfix-apply.yml
          git add -A
          git commit -m "fix(profile+notifications): recognize contact_email in completeness widget; graceful blocked-notifications UX"
          for i in 1 2 3 4 5; do
            git push origin main && break || git pull --rebase -X ours origin main
          done
