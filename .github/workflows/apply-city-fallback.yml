# One-shot, self-deleting workflow: city shortcut fallback in the storefront
# route. A dead storefront slug that matches a known city redirects to the
# city landing page instead of 404ing (/oaklawn -> /peptides/illinois/oak-lawn).
# Assertion-guarded: aborts without committing on any mismatch.

name: Apply City Fallback Redirect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-city-fallback.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply replacement with assertions
        run: |
          cat > /tmp/city-fallback.js <<'CF_EOF'
          const fs = require('fs');
          const FILE = 'app/[agentSlug]/page.tsx';
          let s = fs.readFileSync(FILE, 'utf8');
          function rep(from, to, expected) {
            const parts = s.split(from);
            if (parts.length - 1 !== expected) { console.error('ASSERTION FAILED (' + (parts.length - 1) + ' vs ' + expected + '): ' + JSON.stringify(from.slice(0, 80))); process.exit(1); }
            s = parts.join(to);
            console.log('OK: ' + JSON.stringify(from.slice(0, 60)));
          }
          rep(
            "import { DEFAULT_STORE_SLUG } from '@/lib/default-store';",
            "import { DEFAULT_STORE_SLUG } from '@/lib/default-store';\nimport { CITIES } from '@/lib/cities/cities-data';",
            1
          );
          rep(
            [
              '  if (error || !agent) {',
              '    notFound(); // returns HTTP 404; prevents bots indexing dead storefronts as valid pages',
              '  }',
            ].join('\n'),
            [
              '  if (error || !agent) {',
              '    // City shortcut fallback: people type short URLs like /oaklawn expecting',
              '    // the city landing page at /peptides/illinois/oak-lawn. When a slug',
              '    // matches no storefront but DOES match a known city (compared with',
              '    // punctuation stripped), redirect to that city page instead of 404ing.',
              '    // Ambiguous city names resolve to the highest-priority market',
              '    // (tier, then population).',
              "    const normalizedSlug = agentSlug.toLowerCase().replace(/[^a-z0-9]/g, '');",
              '    const cityMatches = CITIES.filter(',
              "      (c) => c.slug.replace(/[^a-z0-9]/g, '') === normalizedSlug",
              '    );',
              '    if (cityMatches.length > 0) {',
              '      const best = [...cityMatches].sort(',
              '        (a, b) => a.tier - b.tier || b.population - a.population',
              '      )[0];',
              '      redirect(`/peptides/${best.stateSlug}/${best.slug}`);',
              '    }',
              '    notFound(); // returns HTTP 404; prevents bots indexing dead storefronts as valid pages',
              '  }',
            ].join('\n'),
            1
          );
          fs.writeFileSync(FILE, s);
          console.log('Done.');
          CF_EOF
          node /tmp/city-fallback.js

      - name: Commit, remove this workflow, push
        run: |
          git config user.name 'seo-layers-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/workflows/apply-city-fallback.yml
          git add 'app/[agentSlug]/page.tsx'
          git commit -m 'City shortcut fallback: dead storefront slugs redirect to city pages

          /oaklawn 404ed because unknown storefront slugs hit notFound().
          People type short city URLs expecting the city landing pages, so a
          slug that matches no storefront but matches a known city
          (punctuation-insensitive) now redirects to that city page:
          /oaklawn -> /peptides/illinois/oak-lawn. Ambiguous names resolve to
          the highest-priority market (tier, then population).'
          git pull --rebase origin main
          git push origin main
