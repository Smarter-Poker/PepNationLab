# Promote to Production — free-tier gate (no branch protection needed).
#
# Why: branch protection + auto-merge require a paid GitHub plan on a private
# repo. This achieves the same guarantee using GitHub Actions (free on private
# repos) by gating what reaches PRODUCTION instead of what reaches `main`.
#
# How it works:
#   - Agents keep pushing to `main` freely and concurrently (no change for them).
#   - Vercel's Production Branch is set to `production` (one-time setting), so a
#     push to `main` does NOT deploy to production by itself.
#   - This workflow runs on every push to `main`. It (1) verifies the HEAD commit
#     is authored by the approved team identity and (2) runs the real Turbopack
#     production build. Only if BOTH pass does it fast-forward `production` to the
#     commit — which is what Vercel actually deploys.
#
# Result: every production deploy is green AND authored by an identity GitHub
# can attribute. A broken commit, or one authored by a personal mailbox that
# belongs to no GitHub account, simply is not promoted; production holds the
# last good commit until a green, correctly-authored one lands. No Error, no
# Blocked in production, and unlimited concurrent agents.
#
# "Bot-authored" is NOT the test, and reading it that way is what froze
# production for three days on 2026-09-03. The estate's squash-merge app
# authors every commit that reaches `main` here. See the author gate below.

name: Promote to Production

on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize only the promotion (fast), never the agents. Latest green wins.
concurrency:
  group: promote-production

jobs:
  gate-and-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gate's job is to keep out a commit Vercel CANNOT ATTRIBUTE to a
      # GitHub account: that deployment goes straight to BLOCKED, with no build
      # log at all, so nothing downstream can even see why. The address that
      # caused it was `Claude (Cowork) <...@gmail.com>` - a plain mailbox
      # belonging to no GitHub user. It was never "bots are unwelcome".
      #
      # CORRECTED 2026-09-06, after this gate froze production for three days.
      # It compared against ONE literal address. On 2026-09-03 the estate moved
      # squash merges onto its own GitHub App, so every commit reaching `main`
      # since has been authored `smarter-poker-autopilot[bot]` - and this job
      # refused all six of them. `production` sat 6 commits behind `main` from
      # 2026-09-03T16:18 while the build stayed green and main marched on.
      # Nothing raised a hand: the workflow is in no ruleset, so a red run
      # blocks no merge and colours nothing anyone reads.
      #
      # The premise was falsified by the estate's own control group: the World
      # Hub's `main` HEAD carries that same bot as its author, and Vercel had
      # built and promoted it - smarter.poker /api/health served 5f6cf604 while
      # this gate was calling that identity unbuildable.
      #
      # So the list holds every identity that legitimately lands on `main`
      # here, and each one is a `<numeric account id>+<handle>@users.noreply`
      # address, which is precisely what "GitHub can attribute this" means.
      # Adding one is a deliberate line; a stray mailbox still cannot promote.
      - name: Author gate — HEAD must be an approved, attributable identity
        env:
          APPROVED_EMAILS: |
            254329056+Smarter-Poker@users.noreply.github.com
            319745803+smarter-poker-autopilot[bot]@users.noreply.github.com
            49699333+dependabot[bot]@users.noreply.github.com
            41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          author="$(git log -1 --format='%ae')"
          if ! printf '%s\n' "$APPROVED_EMAILS" | grep -Fxq -- "$author"; then
            echo "::error::HEAD author '$author' is not an approved, attributable identity."
            echo "Not promoting to production (Vercel would Block a commit it cannot attribute)."
            echo "Approved identities:"
            printf '%s\n' "$APPROVED_EMAILS" | sed '/^[[:space:]]*$/d;s/^/  - /'
            echo "If this is a new estate actor, add it to APPROVED_EMAILS above."
            echo "If it is a personal mailbox, re-commit under the team identity:"
            echo "  git config user.email \"254329056+Smarter-Poker@users.noreply.github.com\" && git commit --amend --reset-author --no-edit && git push"
            exit 1
          fi
          echo "Author OK: $author"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build gate — real Turbopack production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: "https://pepnationlab.com"
        run: npm run build

      - name: Promote — advance the production branch to this green commit
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          git config user.name "Smarter-Poker"
          git config user.email "254329056+Smarter-Poker@users.noreply.github.com"
          git fetch origin production

          # A plain fast-forward push is what this used to do, and it SILENTLY
          # stopped promoting for hours the moment `production` picked up a
          # commit of its own (a hand-merge, a hotfix landed straight on
          # production). Every push to main then failed with non-fast-forward,
          # the build stayed green, nobody was told, and production quietly
          # froze on an old commit while main marched on. Merge instead: it
          # works whether or not production has diverged, and it never
          # discards production-only work.
          if git merge-base --is-ancestor origin/production HEAD; then
            git push origin "HEAD:production"
            echo "Promoted $sha to production (fast-forward). Vercel will deploy it."
          else
            echo "production has diverged from main; merging instead of fast-forwarding."
            git checkout -B promote-production origin/production
            if ! git merge --no-edit "$sha"; then
              echo "::error::Merging main into production CONFLICTS. Production is NOT updated."
              echo "Resolve the conflict on the production branch by hand, then re-run this job."
              exit 1
            fi
            git push origin "promote-production:production"
            echo "Promoted $sha to production (merge). Vercel will deploy it."
          fi
