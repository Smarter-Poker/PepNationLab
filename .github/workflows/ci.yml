name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels an in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails ONLY when a new TypeScript error is introduced (next.config sets
      # typescript.ignoreBuildErrors=true, so `next build` will not catch them).
      - name: Typecheck gate
        run: node scripts/ci/typecheck-gate.mjs

      # Non-mutating unit tests (db/e2e suites are excluded by the npm script).
      - name: Unit tests
        run: npm test
