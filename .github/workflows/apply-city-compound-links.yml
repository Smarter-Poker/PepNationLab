# One-shot, self-deleting workflow: inserts a crawlable "Popular Research
# Compounds In {city}" pill-link row into the city landing page
# (app/peptides/[stateSlug]/[citySlug]/CityPage.tsx), linking each city to its
# compound-city pages (/peptides/{state}/{city}/{compound}).
#
# Why a workflow instead of a direct push: CityPage.tsx is ~44KB and must not be
# round-tripped whole through the API-only agent channel (see the CompareTool
# truncation incident). The edit is applied here on the runner against the real
# file with STRICT occurrence assertions - if the file on main does not match
# expectations exactly, the job aborts WITHOUT committing.
#
# The workflow removes itself in the same commit.

name: Apply City Compound Links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-city-compound-links.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact-string replacements with assertions
        run: |
          cat > /tmp/apply.js <<'APPLY_EOF'
          const fs = require('fs');
          const FILE = 'app/peptides/[stateSlug]/[citySlug]/CityPage.tsx';
          let s = fs.readFileSync(FILE, 'utf8');

          function rep(from, to, expected) {
            const parts = s.split(from);
            const found = parts.length - 1;
            if (found !== expected) {
              console.error('ASSERTION FAILED (expected ' + expected + ', found ' + found + '): ' + JSON.stringify(from.slice(0, 90)));
              process.exit(1);
            }
            s = parts.join(to);
            console.log('OK (' + expected + 'x): ' + JSON.stringify(from.slice(0, 60)));
          }

          if (s.includes('CITY_COMPOUNDS')) {
            console.error('ASSERTION FAILED: CITY_COMPOUNDS already present; nothing to do');
            process.exit(1);
          }

          // 1. Import the curated compound list.
          rep(
            "import type { City } from '@/lib/cities/cities-data';",
            "import type { City } from '@/lib/cities/cities-data';\nimport { CITY_COMPOUNDS } from '@/lib/cities/city-compounds';",
            1
          );

          // 2. Insert the crawlable compound pill-link row before NearbyStrip.
          const anchor = "        <NearbyStrip stateSlug={stateSlug} currentCitySlug={citySlug} stateName={city.state} region={city.region} />";
          const lines = [
            "        {/* POPULAR RESEARCH COMPOUNDS IN THIS CITY - crawlable pill links to compound-city pages */}",
            "        <section style={{ padding: 'var(--space-10) 0', borderTop: '1px solid rgba(255,255,255,0.04)' }}>",
            "          <div className='container'>",
            "            <p style={{ fontSize: '0.7rem', color: 'var(--grey-600)', textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 'var(--space-4)' }}>",
            "              Popular Research Compounds In {city.name}",
            "            </p>",
            "            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 'var(--space-2)' }}>",
            "              {CITY_COMPOUNDS.map((cc) => (",
            "                <Link key={cc.slug} href={`/peptides/${stateSlug}/${citySlug}/${cc.slug}`} className='city-pill' style={{ padding: '5px 14px', fontSize: '0.78rem', color: 'var(--grey-500)', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.07)', borderRadius: 'var(--radius-full)', textDecoration: 'none', transition: 'all 0.2s' }}>",
            "                  {cc.displayName} In {city.name}",
            "                </Link>",
            "              ))}",
            "            </div>",
            "          </div>",
            "        </section>",
            "",
            anchor
          ];
          rep(anchor, lines.join('\n'), 1);

          if (!s.includes("import { CITY_COMPOUNDS } from '@/lib/cities/city-compounds';")) {
            console.error('ASSERTION FAILED: import missing after replacement');
            process.exit(1);
          }
          if (!s.includes('Popular Research Compounds In {city.name}')) {
            console.error('ASSERTION FAILED: compound row missing after replacement');
            process.exit(1);
          }

          fs.writeFileSync(FILE, s);
          console.log('All replacements applied.');
          APPLY_EOF
          node /tmp/apply.js

      - name: Typecheck gate
        run: |
          npm ci
          node scripts/ci/typecheck-gate.mjs

      - name: Commit, remove this workflow, push
        run: |
          git config user.name "city-compound-links-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/apply-city-compound-links.yml
          git add 'app/peptides/[stateSlug]/[citySlug]/CityPage.tsx'
          git commit -m "feat(seo/cities): link each city page to its compound-city pages

          Adds a crawlable 'Popular Research Compounds In {city}' pill-link row
          before the NearbyStrip, linking each city landing page to its
          /peptides/{state}/{city}/{compound} pages. Applied by the one-shot
          workflow (now removed) with strict occurrence assertions and a
          typecheck gate; CityPage.tsx is ~44KB and cannot be round-tripped
          safely through the API-only agent channel."
          git pull --rebase origin main
          git push origin main
