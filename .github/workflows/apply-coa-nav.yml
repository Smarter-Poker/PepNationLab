# One-shot, self-deleting workflow: inserts the Certificates Of Analysis nav link
# into the admin sidebar. Applies an assertion-guarded insert on the runner
# (anchor present exactly once, link not already there) rather than hand-editing
# the 16 KB layout file through the API. Aborts without committing on mismatch.
name: Apply COA Nav Link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-coa-nav.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Insert nav link with assertions
        run: |
          echo '' | base64 -d > /tmp/insert_nav.js
          node /tmp/insert_nav.js
      - name: Commit, remove workflow, push
        run: |
          git config user.name "coa-nav-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/apply-coa-nav.yml
          git add app/admin/AdminLayoutClient.tsx
          git commit -m "feat(admin): add Certificates Of Analysis nav link (one-shot, self-removed)"
          git pull --rebase origin main
          git push origin main
