name: Phase3 Apply
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: phase3-apply
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode manifest and script
        env:
          MANI_B64: ""
          SCRIPT_B64: ""
        run: |
          printf '%s' "$MANI_B64" | base64 -d | gunzip > manifest.json
          printf '%s' "$SCRIPT_B64" | base64 -d > apply.mjs
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest ok')"
      - name: Apply manifest
        run: node apply.mjs
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f manifest.json apply.mjs
          git rm -f .github/workflows/phase3-apply.yml
          git add -A
          git commit -m "Security phase 3: XSS sanitization, CSP unsafe-eval removal, MFA rate limit, privileged-fn autolock migration"
          for i in 1 2 3 4 5; do
            git push origin main && break || git pull --rebase -X ours origin main
          done
