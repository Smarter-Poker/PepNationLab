name: DB Integration Tests

# Runs the __tests__/db suite against a real Supabase project.
#
# The target must be an explicitly configured isolated Supabase database.
# Production fixture writes are refused before Vitest imports any test helper.
# Missing isolation evidence is a failed preflight, never a passing skipped suite.

on:
  pull_request:
    paths:
      - '__tests__/db/**'
      - 'lib/**'
      - 'supabase/migrations/**'
      - 'scripts/ci/check-db-test-target.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests-db.yml'
  push:
    branches: [main]
    paths:
      - '__tests__/db/**'
      - 'lib/**'
      - 'supabase/migrations/**'
      - 'scripts/ci/check-db-test-target.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests-db.yml'
  # Manual trigger so a maintainer can run the suite against any branch
  # once a Supabase branch DB is provisioned.
  workflow_dispatch: {}

jobs:
  db-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 22, not 20. @supabase/supabase-js ^2.112 builds a RealtimeClient
          # inside createClient() and asks for a native `WebSocket` global,
          # which Node did not ship until 22. On 20 all three suites in this
          # job died in their own import with
          #   Error: Node.js detected but native WebSocket not found.
          #     at getWebSocketConstructor (realtime-js/lib/websocket-factory)
          # before a single assertion ran, and the SDK printed the reason on
          # its way past: "Node.js 20 and below are deprecated ... upgrade to
          # Node.js 22 or later."
          #
          # This job had been failing that way on `main` for thirteen days,
          # found 2026-09-06 by the estate-wide green-on-main sweep. It is in
          # no ruleset, so a red run blocked no merge and coloured nothing
          # anybody reads. pr-gate.yml and promote-to-production.yml were
          # already on 22 and green, which is why the repo looked fine.
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Refuse production fixtures or missing isolation configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TEST_PROJECT_REF: ${{ vars.SUPABASE_TEST_PROJECT_REF }}
        run: node scripts/ci/check-db-test-target.mjs
      - name: Vitest (db suite)
        env:
          SUPABASE_TEST_PROJECT_REF: ${{ vars.SUPABASE_TEST_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:db
