# One-shot self-deleting applier for the national city expansion (v2 re-arm:
# first trigger fired before the data blocks were staged).
name: Apply National City Expansion
on:
  push:
    paths:
      - '.github/workflows/apply-national-cities.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-national-cities
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply National City Expansion
        run: node scripts/national-cities/apply.cjs

      - name: Validate Expanded Data
        run: node --experimental-strip-types scripts/national-cities/validate.mjs

      - name: Commit And Push
        run: |
          git config user.name "national-cities-bot"
          git config user.email "national-cities-bot@users.noreply.github.com"
          git rm -q .github/workflows/apply-national-cities.yml
          git rm -rq scripts/national-cities
          git add lib/cities/cities-data.ts
          git commit -m "feat(seo): national city coverage - add 14 missing states (96 cities) and expand California to 103 fully-built city pages with county, ZIP, region, and unique local anchor blurbs"
          git pull --rebase origin main
          git push origin HEAD:main
