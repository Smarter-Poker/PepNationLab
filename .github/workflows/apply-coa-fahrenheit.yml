# One-shot, self-deleting workflow: converts user-facing storage temperatures
# from Celsius to Fahrenheit in lib/help-faq.ts and components/research/
# CalculatorSuite.tsx (storage advice strings, the Arrhenius calculator inputs,
# presets, output, and journal note; the physics still computes in Celsius/Kelvin
# via an F->C conversion). Each replacement asserts an exact expected count and
# aborts WITHOUT committing on any mismatch. Removes itself.
name: Apply COA Fahrenheit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-coa-fahrenheit.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply Fahrenheit replacements with assertions
        run: |
          echo '' | base64 -d > /tmp/coa_faren.js
          node /tmp/coa_faren.js write
      - name: Commit, remove workflow, push
        run: |
          git config user.name "coa-fahrenheit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/apply-coa-fahrenheit.yml
          git add lib/help-faq.ts components/research/CalculatorSuite.tsx
          git commit -m "feat(coa): use Fahrenheit for storage temperatures (one-shot, self-removed)"
          git pull --rebase origin main
          git push origin main
