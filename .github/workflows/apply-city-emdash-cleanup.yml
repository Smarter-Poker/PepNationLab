# One-shot, self-deleting workflow: removes em dashes from the per-state city
# data files (lib/cities/data/*.ts). Four localBlurb strings get a targeted
# comma rewrite (asserted exact-match); every remaining em dash (file header
# comments) becomes a plain hyphen. Applied on the runner because several of
# these files are far larger than 25KB and must not round-trip through the
# API-only agent channel (see the CompareTool truncation incident).
#
# Aborts WITHOUT committing if the blurb anchors have drifted.
# The workflow removes itself in the same commit.

name: Apply City Data Em Dash Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-city-emdash-cleanup.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-city-emdash-cleanup
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted blurb rewrites with assertions, then global sweep
        run: |
          python3 - <<'EOF'
          import glob, sys

          EM = '—'
          RQ = '’'

          blurb_edits = {
            'lib/cities/data/new-york.ts': [
              ('home to Albany Medical Center and Albany Med College ' + EM + ' the Capital Region' + RQ + 's largest academic-medical and research hub.',
               'home to Albany Medical Center and Albany Med College, the Capital Region' + RQ + 's largest academic-medical and research hub.'),
            ],
            'lib/cities/data/new-jersey.ts': [
              ('home to Hackensack University Medical Center ' + EM + ' one of New Jersey' + RQ + 's largest research hospitals.',
               'home to Hackensack University Medical Center, one of New Jersey' + RQ + 's largest research hospitals.'),
              ('University Hospital, and NJIT ' + EM + ' a major research corridor.',
               'University Hospital, and NJIT, a major research corridor.'),
              ('the Rutgers Cancer Institute of New Jersey ' + EM + ' the state' + RQ + 's flagship research city.',
               'the Rutgers Cancer Institute of New Jersey, the state' + RQ + 's flagship research city.'),
            ],
          }

          for f, pairs in blurb_edits.items():
              s = open(f, encoding='utf-8').read()
              for old, new in pairs:
                  n = s.count(old)
                  if n != 1:
                      print('ABORT: anchor occurs %d times in %s: %r' % (n, f, old[:60]))
                      sys.exit(78)
                  s = s.replace(old, new)
              open(f, 'w', encoding='utf-8').write(s)

          changed = 0
          for f in glob.glob('lib/cities/data/*.ts'):
              s = open(f, encoding='utf-8').read()
              if EM in s:
                  open(f, 'w', encoding='utf-8').write(s.replace(EM, '-'))
                  changed += 1
          print('files swept:', changed)

          for f in glob.glob('lib/cities/**/*.ts', recursive=True) + glob.glob('lib/cities/*.cjs'):
              if EM in open(f, encoding='utf-8').read():
                  print('ABORT: em dash still present in', f)
                  sys.exit(78)
          print('lib/cities is em dash free')
          EOF

      - name: Commit as team identity and self-delete
        run: |
          set -euo pipefail
          git config user.name "Smarter-Poker"
          git config user.email "254329056+Smarter-Poker@users.noreply.github.com"
          git rm .github/workflows/apply-city-emdash-cleanup.yml
          git add lib/cities/data
          git commit -m "style(cities): remove em dashes from per-state city data (one-shot, self-removed)"
          git pull --rebase origin main
          git push origin HEAD:main
