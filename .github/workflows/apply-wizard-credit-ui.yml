# One-shot, self-deleting workflow: ships the client half of the agent
# onboarding wizard upgrade (payment / billing / share QR / compliance steps)
# and the credit-wall action in AgentInventory. OnboardingWizard.tsx and
# AgentInventory.tsx are large files, so they are patched on the runner with
# strict string assertions plus a final git blob sha gate (values computed
# from the locally tsc-verified files). Aborts without committing on any
# mismatch. Server halves already landed in 77c179d and a28ccca.

name: Apply Wizard And Credit UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wizard-credit-ui.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply assertion-guarded replacements
        run: node scripts/onboarding-apply/apply.cjs

      - name: Commit, remove one-shot files, push
        run: |
          git config user.name 'wizard-credit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/workflows/apply-wizard-credit-ui.yml
          git rm -rq scripts/onboarding-apply
          git add components/OnboardingWizard.tsx components/AgentInventory.tsx
          git commit -m 'Agent wizard: payment, billing, share QR, compliance steps + credit wall

          Client half of the onboarding wizard upgrade: PaymentStep (verified
          against agent_profiles.payment_handles via /api/account/payment-method),
          BillingStep (credit vs prepaid explainer with live limit and balance),
          ShareStep (storefront link copy + QR via QRCodeGenerator), and
          ComplianceStep (research-use-only acknowledgment). AgentInventory now
          renders CreditWallAction when a wholesale restock is blocked by the
          credit limit, so the agent can request an increase on the spot.'
          git pull --rebase origin main
          git push origin main
