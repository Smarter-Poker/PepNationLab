# One-shot, self-removing cleanup (established repo pattern - see prior
# "one-shot ... (self-deleting)" commits). The GitHub content API used by
# agent sessions cannot delete files, so this workflow performs the deletion.
#
# WHY: app/[agentSlug]/loading.tsx and app/research/loading.tsx create
# route-level Suspense boundaries that flush a streamed HTTP 200 shell BEFORE
# the DB existence check resolves, so every notFound() on those routes ships
# as a soft-404 (status 200). Because [agentSlug] is the site-wide catch-all,
# every mistyped URL on the domain returned 200. Removing the boundaries makes
# notFound() yield a real HTTP 404 again.
name: seo-oneshot-remove-loading

on:
  push:
    paths:
      - '.github/workflows/seo-oneshot-remove-loading.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-loading-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Remove streamed-200 loading boundaries and self-remove
        run: |
          git config user.name "Smarter-Poker"
          git config user.email "254329056+Smarter-Poker@users.noreply.github.com"
          git rm --ignore-unmatch 'app/[agentSlug]/loading.tsx' 'app/research/loading.tsx'
          git rm '.github/workflows/seo-oneshot-remove-loading.yml'
          git commit -m "seo: real 404s - remove route-level loading boundaries that streamed 200 for notFound() (one-shot, self-removed)"
          git pull --rebase origin main || true
          git push origin HEAD:main
