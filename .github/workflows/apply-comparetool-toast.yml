# One-shot, self-deleting workflow: replaces the two native alert() calls in
# components/research/CompareTool.tsx with sonner toasts, matching the toast
# pattern used everywhere else in the app.
#
# Why a workflow instead of a direct push: CompareTool.tsx is ~245KB, which is
# too large to round-trip safely through the API-only agent channel (see the
# CompareTool truncation incident). The edit is applied here on the runner,
# against the real file, with STRICT occurrence assertions - if the file on
# main does not match expectations exactly, the job aborts WITHOUT committing.
#
# The workflow removes itself in the same commit.

name: Apply CompareTool Toast Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-comparetool-toast.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact-string replacements with assertions
        run: |
          cat > /tmp/apply.js <<'APPLY_EOF'
          const fs = require('fs');
          const FILE = 'components/research/CompareTool.tsx';
          let s = fs.readFileSync(FILE, 'utf8');

          function rep(from, to, expected) {
            const parts = s.split(from);
            const found = parts.length - 1;
            if (found !== expected) {
              console.error('ASSERTION FAILED (expected ' + expected + ', found ' + found + '): ' + JSON.stringify(from.slice(0, 100)));
              process.exit(1);
            }
            s = parts.join(to);
            console.log('OK (' + expected + 'x): ' + JSON.stringify(from.slice(0, 60)));
          }

          const alertCount = (s.match(/alert\(/g) || []).length;
          if (alertCount !== 2) {
            console.error('ASSERTION FAILED: expected exactly 2 alert( occurrences, found ' + alertCount);
            process.exit(1);
          }
          if (s.includes("from 'sonner'")) {
            console.error('ASSERTION FAILED: sonner is already imported; nothing to do');
            process.exit(1);
          }

          rep(
            "import { escapeWithLineBreaks } from '@/lib/sanitize-html';",
            "import { escapeWithLineBreaks } from '@/lib/sanitize-html';\nimport { toast } from 'sonner';",
            1
          );

          rep(
            "        alert('Saved to Lab Journal!');",
            "        toast.success('Saved To Lab Journal.');",
            1
          );

          rep(
            "        alert('Failed to save. Make sure you are logged in.');",
            "        toast.error('Failed To Save. Make Sure You Are Logged In.');",
            1
          );

          if (/alert\(/.test(s)) {
            console.error('ASSERTION FAILED: alert( still present after replacement');
            process.exit(1);
          }
          if (!s.includes("import { toast } from 'sonner';")) {
            console.error('ASSERTION FAILED: sonner import missing after replacement');
            process.exit(1);
          }

          fs.writeFileSync(FILE, s);
          console.log('All replacements applied.');
          APPLY_EOF
          node /tmp/apply.js

      - name: Typecheck gate
        run: |
          npm ci
          node scripts/ci/typecheck-gate.mjs

      - name: Commit, remove this workflow, push
        run: |
          git config user.name "comparetool-toast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/apply-comparetool-toast.yml
          git add components/research/CompareTool.tsx
          git commit -m "fix(compare): use sonner toasts instead of native alert()

          Applied by the one-shot workflow (now removed). The Save-To-Lab-Journal
          success and failure paths used native alert() dialogs, inconsistent with
          the sonner toasts used everywhere else in the app. CompareTool.tsx is
          ~245KB and cannot be round-tripped safely through the API-only agent
          channel, so the edit was applied on the runner with strict occurrence
          assertions and a typecheck gate."
          git pull --rebase origin main
          git push origin main
