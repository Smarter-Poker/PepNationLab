# One-shot, self-deleting workflow: applies the Product Manager UI changes to
# components/AgentStoreProducts.tsx (66KB - too large to push safely through
# the API-only agent channel; see the CompareTool truncation incident).
#
# Changes applied, with STRICT occurrence assertions - if the file on main
# does not match expectations exactly, the job aborts WITHOUT committing:
#   1. costLabel prop (default 'Your Cost'; admin page passes 'Base Cost')
#   2. All 4 cost labels render {costLabel}
#   3. MarketIntel: static "Profit At Market Avg" replaced by a dynamic
#      "Current Profit" that recomputes from the in-progress price edit
#   4. Below-cost toast uses costLabel
#
# The workflow removes itself in the same commit.

name: Apply Product Manager Component Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-product-manager-component.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact-string replacements with assertions
        run: |
          cat > /tmp/apply.js <<'APPLY_EOF'
          const fs = require('fs');
          const FILE = 'components/AgentStoreProducts.tsx';
          let s = fs.readFileSync(FILE, 'utf8');

          function rep(from, to, expected) {
            const parts = s.split(from);
            const found = parts.length - 1;
            if (found !== expected) {
              console.error('ASSERTION FAILED for pattern (expected ' + expected + ', found ' + found + '):');
              console.error(JSON.stringify(from.slice(0, 120)));
              process.exit(1);
            }
            s = parts.join(to);
            console.log('OK (' + expected + 'x): ' + JSON.stringify(from.slice(0, 60)) + ' ...');
          }

          rep(
            'export default function AgentStoreProducts({ agentId }: { agentId: string }) {',
            "export default function AgentStoreProducts({ agentId, costLabel = 'Your Cost' }: { agentId: string; costLabel?: string }) {",
            1
          );

          rep(
            "textTransform: 'uppercase' }}>Your Cost:</span>",
            "textTransform: 'uppercase' }}>{costLabel}:</span>",
            4
          );

          rep(
            '  const headroom = yourCost != null ? mktAvg - yourCost : null;',
            [
              '  // Live profit at the CURRENT listed price (priceOverride carries the',
              '  // in-progress edit), so this number updates dynamically as the price is',
              '  // typed rather than showing a static profit-at-market-average figure.',
              '  const currentProfit = yourCost != null && yourPrice != null ? yourPrice - yourCost : null;',
            ].join('\n'),
            1
          );

          rep(
            [
              '      {headroom != null && headroom > 0 && (',
              "        <span style={{ fontSize: '0.68rem', color: 'var(--teal)', fontWeight: 700 }}>",
              '          Profit At Market Avg: ${headroom.toFixed(2)} / {unitLabel}',
              '        </span>',
              '      )}',
            ].join('\n'),
            [
              '      {currentProfit != null && (',
              "        <span style={{ fontSize: '0.68rem', color: currentProfit >= 0 ? 'var(--teal)' : '#FC8181', fontWeight: 700 }}>",
              '          Current Profit: ${currentProfit.toFixed(2)} / {unitLabel}',
              '        </span>',
              '      )}',
            ].join('\n'),
            1
          );

          rep(
            'Listed Price Cannot Be Below Your Cost ($',
            'Listed Price Cannot Be Below ${costLabel} ($',
            1
          );

          if (s.includes('headroom')) {
            console.error('ASSERTION FAILED: headroom still referenced after replacement');
            process.exit(1);
          }

          fs.writeFileSync(FILE, s);
          console.log('All replacements applied.');
          APPLY_EOF
          node /tmp/apply.js

      - name: Commit, remove this workflow, push
        run: |
          git config user.name "product-manager-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/apply-product-manager-component.yml
          git add components/AgentStoreProducts.tsx
          git commit -m "Product Manager UI: costLabel prop + dynamic Current Profit per vial

          Applied by the one-shot workflow (now removed):
          - AgentStoreProducts accepts costLabel (default 'Your Cost'); the
            admin Product Manager passes 'Base Cost' since the admin's cost
            basis on the main store is COGS.
          - Market Intel strip now shows Current Profit per vial computed from
            the live listed price (updates dynamically while editing) instead
            of the static profit-at-market-average figure; negative profit
            renders red.
          - Below-cost validation toast uses the cost label."
          git pull --rebase origin main
          git push origin main
