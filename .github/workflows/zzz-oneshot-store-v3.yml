name: oneshot-store-v3
on:
  push:
    paths:
      - '.github/workflows/zzz-oneshot-store-v3.yml'
permissions:
  contents: write
concurrency: oneshot-store-v3
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply verified edits
        run: node scripts/oneshot-store-features.mjs
      - name: Push to fixed branch
        run: |
          git config user.name "cowork-oneshot"
          git config user.email "oneshot@users.noreply.github.com"
          git checkout -b feat/store-oneshot
          git add "app/api/orders/route.ts" "app/checkout/CheckoutForm.tsx" "app/[agentSlug]/page.tsx" "components/AgentStorefrontGrid.tsx" "app/layout.tsx" "components/FreeShippingBanner.tsx"
          git commit -m 'feat(store): house free shipping $100+ and market-intel strikethrough (admin store)'
          git push -f origin feat/store-oneshot
  cleanup:
    needs: apply
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove one-shot scaffold from main
        run: |
          git config user.name "cowork-oneshot"
          git config user.email "oneshot@users.noreply.github.com"
          git rm -f scripts/oneshot-store-features.mjs .github/workflows/zzz-oneshot-store-v3.yml || true
          git commit -m 'chore: remove one-shot store-features scaffold (v3)' || echo "nothing"
          git push origin HEAD:main || echo "skip"
