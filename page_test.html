"circadian rhythm\",\"melatonin production\",\"telomere lengthening\",\"antioxidant\"],\"research_areas\":[\"longevity\",\"immune\",\"sleep\",\"cognitive\"],\"benefits\":\"In vitro work in human fibroblasts reported induced telomerase activity and telomere elongation. Animal data show antioxidant and antitumor signals. Human evidence is limited, old, and from a single research group, so it is preliminary.\",\"side_effects\":\"No well characterized adverse-event profile; reported well tolerated in sparse low-quality studies. Theoretical concern that telomerase upregulation could favor proliferation of malignant cells.\",\"warnings\":\"Not approved anywhere; thin, non-independent human evidence. Research use only.\",\"handling\":{\"form\":\"lyophilized\",\"notes\":\"Very short plasma half-life.\",\"diluent\":\"bacteriostatic or sterile water\",\"freeze_thaw\":\"avoid\",\"storage_temp\":\"-20C frozen long-term, refrigerate after reconstitution\",\"light_sensitive\":true,\"reconstituted_days\":28},\"regulatory\":\"Not FDA or EMA approved; research chemical only.\",\"wada_status\":\"not_listed\",\"sources\":[\"pubmed.ncbi.nlm.nih.gov/12937682\",\"en.wikipedia.org/wiki/Epitalon\",\"link.springer.com/article/10.1007/s10522-025-10315-x\",\"pubmed.ncbi.nlm.nih.gov/14523363\"],\"plain_summary\":\"A short pineal-derived peptide studied for telomere and aging biology. Evidence is mostly cell-culture and animal; human data are preliminary.\",\"is_temp_sensitive\":true,\"is_pro_angiogenic\":false,\"is_glp1\":false,\"is_stack\":false,\"stack_components\":[],\"stack_rationale\":null,\"risk_level\":\"low\",\"risk_reasons\":[],\"recommended_action\":\"keep\",\"reconstitution_shelf_days\":28,\"created_at\":\"2026-06-02T10:22:11.434376+00:00\",\"updated_at\":\"2026-06-09T05:00:30.160221+00:00\",\"search_keywords\":[\"Epitalon\",\"Epithalone\",\"AEDG\",\"Ala-Glu-Asp-Gly\",\"Khavinson peptide\",\"epithalamin fragment\",\"epithalion\",\"anti-aging support\",\"longevity research\",\"telome telomere_elongation\":85,\"cancer_prevention_research\":72},\"best_stacked_with\":[\"nad-plus\",\"ss-31\",\"thymalin\",\"pinealon\",\"melatonin\",\"bac-water\"],\"typical_frequency\":\"Daily to every other day SC injection\",\"purity_percentage\":null,\"coa_url\":null,\"eli5_summary\":\"Epithalon is an anti-aging master switch. Imagine your cells have little shoelace caps on their DNA that wear down as you get older. Epithalon rebuilds those caps, making old cells act young again.\",\"embedding\":null},{\"id\":\"2e9c3045-12c5-4e54-8f5d-1de5570627bd\",\"slug\":\"follistatin\",\"display_name\":\"Follistatin\",\"aliases\":[\"FST\",\"Follistatin 344\",\"FS-344\",\"Follistatin-344\",\"FST344\",\"Activin-binding protein\",\"Myostatin inhibitor protein\",\"Follistatin 288\",\"FS-288\",\"Follistatin peptide\",\"Anti-myostatin\",\"Muscle growth factor\",\"Follistatin recombinant\",\"FST-344 peptide\",\"FST-344\",\"myostatin inhibitor\"],\"category\":\"Muscle Growth \u0026 Performance\",\"evidence_tier\":\"preclinical\",\"compound_class\":\"Endogenous glycoprotein / activin-binding protein (recombinant)\",\"molecular_target\":\"Myostatin (GDF-8) and activin A neutralization; prevents TGF-beta superfamily inhibition of muscle growth\",\"identity\":{\"cas\":\"not standardized\",\"parent\":\"Human FST gene\",\"sequence\":\"344-residue glycoprotein\",\"molecular_weight\":\"~38 kDa\"},\"mechanism\":\"It permanently binds to and traps a protein called myostatin. Since myostatin is the exact chemical signal that tells muscles to stop growing, trapping it allows muscles to grow unrestricted.\",\"studied_for\":[\"Muscle hypertrophy\",\"Myostatin inhibition\",\"Female fertility\",\"Lean muscle mass increase\",\"Anti-myostatin therapy\",\"Duchenne muscular dystrophy models\",\"Muscle wasting / sarcopenia research\",\"Strength gain research\",\"Body recomposition\",\"Ovarian follicle development\",\"Reproductive hormone regulation\",\"FSH inhibition\",\"Activin neutralization\",\"Anabolic signaling amplification\",\"Muscle fiber growth\",\"Fat mass reduction via muscle increase\",\"Athletic performance research\",\"muscle growth\",\"hypertrophy\",\"bodybuilding\",\"muscle wasting\",\"sarcopenia\"],\"research_areas\":[\"performance\",\"hormonal\",\"healing\",\"tissue_repair\"],\"benefits\":\"Animal gene-therapy studies show large, durable muscle gains. Human data are minimal and limited to localized gene therapy. Injected recombinant peptide is rapidly cleared, a key limitation.\",\"side_effects\":\"Sparse human data; theoretical reproductive, cardiac, and tumor-microenvironment effects from broad systemic myostatin and activin blockade.\",\"warnings\":\"No approved human use; recombinant peptide pharmacokinetics are poor. WADA-prohibited (myostatin inhibitor). Research use only.\",\"handling\":{\"form\":\"lyophilized\",\"notes\":\"Large glycoprotein; rapidly cleared when injected.\",\"diluent\":\"sterile or bacteriostatic water; gentle, avoid foaming\",\"freeze_thaw\":\"avoid\",\"storage_temp\":\"-20C, dark\",\"light_sensitive\":true,\"reconstituted_days\":14},\"regulatory\":\"Not FDA-approved; experimental. WADA-prohibited (myostatin / activin-pathway agent).\",\"wada_status\":\"prohibited\",\"sources\":[\"pnas.org/doi/10.1073/pnas.0709144105\",\"newtropin.com/peptides/follistatin-344\"],\"plain_summary\":\"A myostatin-blocking protein studied for muscle growth, mostly via gene therapy; banned in sport.\",\"is_temp_sensitive\":true,\"is_pro_angiogenic\":false,\"is_glp1\":false,\"is_stack\":false,\"stack_components\":[],\"stack_rationale\":null,\"risk_level\":\"moderate\",\"risk_reasons\":[\"WADA-prohibited (myostatin inhibitor)\",\"Injected recombinant rapidly cleared; durable effects need gene delivery\"],\"recommended_action\":\"review\",\"reconstitution_shelf_days\":14,\"created_at\":\"2026-06-02T10:25:04.098288+00:00\",\"updated_at\":\"2026-06-09T05:00:28.123839+00:00\",\"search_keywords\":[\"FST\",\"Follistatin-344\",\"FST-344\",\"activin-bin ers_last_synced_at\":\"2026-06-09T05:00:28.108+00:00\",\"efficacy_scores\":{\"anabolic\":90,\"strength_gains\":88,\"female_fertility\":75,\"muscle_hypertrophy\":92,\"myostatin_inhibition\":95},\"best_stacked_with\":[\"igf-1-lr3\",\"cjc-1295-no-dac\",\"ipamorelin\",\"bac-water\"],\"typical_frequency\":\"Daily SC or IM injection during cycles\",\"purity_percentage\":null,\"coa_url\":null,\"eli5_summary\":\"Your body has a natural brake pedal that stops your muscles from getting too big. Follistatin cuts that brake cable. Without the brake, your muscles are free to grow much larger and stronger.\",\"embedding\":null},{\"id\":\"ad51ca42-25c4-49b4-b491-4ab30dac79e9\",\"slug\":\"foxo4-dri\",\"display_name\":\"FOXO4-DRI\",\"aliases\":[\"FOXO4 D-Retro-Inverso\",\"FOXO4-DRI peptide\",\"FOXO4 DRI\",\"FOXO4 senolytic\",\"FOXO4-p53 disruptor\",\"Senolytic peptide\",\"D-retro-inverso FOXO4\",\"Senescent cell clearance peptide\",\"FOXO4 peptide\",\"Anti-senescence peptide\",\"Healthspan peptide\",\"Age reversal peptide\",\"senolytic\",\"anti-aging\",\"proxofim\"],\"category\":\"Anti-Aging \u0026 Longevity\",\"evidence_tier\":\"preclinical\",\"compound_class\":\"D-retro-inverso peptide; protease-resistant cell-penetrating senolytic\",\"molecular_target\":\"FOXO4-p53 protein-protein interaction; disrupts pro-survival signaling in senescent cells, inducing selective apoptosis\",\"identity\":{\"cas\":\"not standardized\",\"parent\":\"FOXO4 transcription factor\",\"sequence\":\"~43-residue D-amino-acid retro-inverso FOXO4 analog\",\"molecular_weight\":\"~5 kDa\"},\"mechanism\":\"It breaks the lock that zombie (senescent) cells use to keep themselves alive. Once the lock is broken, the zombie cell undergoes natural self-destruction (apoptosis), clearing the way for fresh cells.\",\"studied_for\":[\"Senolytics / senescent cell clearance\",\"Aging / healthspan extension\",\"Chemotherapy-induced senescence reversal\",\"Physical fitness restoration in aging models\",\"Hair follicle rejuvenation in aging\",\"Kidney function in aging models\",\"Liver health in aging\",\"Inflammatory burden reduction\",\"SASP (senescence-associated secretory phenotype) suppression\",\"p53-FOXO4 interaction disruption\",\"Apoptosis induction in senescent cells\",\"Age-related tissue dysfunction\",\"Frailty research\",\"Longevity extension research\",\"cellular senescence\",\"longevity\",\"apoptosis of damaged cells\",\"healthspan extension\",\"hair regrowth\",\"frailty\"],\"research_areas\":[\"longevity\",\"immune\",\"tissue_repair\"],\"benefits\":\"A landmark mouse study reported selective killing of senescent cells with restored fur, kidney function, and fitness in aged and progeroid mice. No human efficacy data exist. Preclinical only.\",\"side_effects\":\"No human safety data. As a p53-activating apoptosis inducer it carries theoretical off-target apoptosis and injection-site risks.\",\"warnings\":\"Entirely preclinical; mechanism risk is uncharacterized in humans. Research use only.\",\"handling\":{\"form\":\"lyophilized\",\"notes\":\"D-retro-inverso design is unusually protease-resistant; can be less soluble.\",\"diluent\":\"sterile or bacteriostatic water\",\"freeze_thaw\":\"avoid\",\"storage_temp\":\"-20C frozen, dark\",\"light_sensitive\":true,\"reconstituted_days\":28},\"regulatory\":\"Not approved; investigational/research chemical.\",\"wada_status\":\"not_listed\",\"sources\":[\"cell.com/cell/fulltext/S0092-8674(17)30246-5\",\"pubmed.ncbi.nlm.nih.gov/40593617\"],\"plain_summary\":\"An experimental senolytic peptide that clears aged (senescent) cells in mice. No human data; strictly preclinical.\",\"is_temp_sensitive\":true,\"is_pro_angiogenic\":false,\"is_glp1\":false,\"is_stack\":false,\"stack_components\":[],\"stack_rationale\":null,\"risk_level\":\"moderate\",\"risk_reasons\":[\"Preclinical only with no human safety data\",\"p53-activating apoptosis mechanism uncharacterized in humans\"],\"recommended_action\":\"review\",\"reconstitution_shelf_days\":28,\" ,\"ema_approval_year\":null,\"dailymed_setid\":null,\"dea_schedule\":null,\"faers_event_count\":0,\"faers_last_synced_at\":\"2026-06-09T05:00:21.544+00:00\",\"efficacy_scores\":{\"senolytic\":90,\"anti_aging\":88,\"healthspan\":85,\"kidney_function\":72,\"hair_restoration\":75},\"best_stacked_with\":[\"epithalon\",\"nad-plus\",\"ss-31\",\"thymalin\",\"bac-water\"],\"typical_frequency\":\"Daily SC injection in research protocols\",\"purity_percentage\":null,\"coa_url\":null,\"eli5_summary\":\"As you age, some of your cells turn into \\\"zombies\\\"—they stop working but refuse to die, and they make nearby cells sick. FOXO4-DRI is a sniper that hunts down these zombie cells and destroys them, leaving healthy cells alone.\",\"embedding\":null},{\"id\":\"658405bc-ae66-443e-af68-579877dcbc43\",\"slug\":\"ghk-cu\",\"display_name\":\"GHK-Cu\",\"aliases\":[\"Copper peptide\",\"Glycyl-L-histidyl-L-lysine copper\",\"GHK-Copper\",\"GHK Cu\",\"Copper tripeptide-1\",\"Copper peptide GHK\",\"Lamin\",\"Iamin\",\"Tricomin\",\"Folligen\",\"Skin copper peptide\",\"GHK cupric complex\",\"CuGHK\",\"Glycyl histidyl lysine\",\"Collaxyl\",\"Copper peptide serum\",\"copper peptide\",\"GHK copper\",\"blue peptide\",\"wrinkles\"],\"category\":\"Skin, Hair \u0026 Cosmetics\",\"evidence_tier\":\"cosmetic\",\"compound_class\":\"Naturally occurring copper-binding tripeptide (Gly-His-Lys + Cu2+)\",\"molecular_target\":\"Extracellular matrix remodeling via MMP/TIMP balance; TGF-beta modulation; antioxidant enzyme (SOD, catalase) upregulation; VEGF and FGF stimulation\",\"identity\":{\"cas\":\"49557-75-7 (GHK-Cu complex)\",\"parent\":\"Plasma copper tripeptide\",\"sequence\":\"Gly-His-Lys + Cu(II)\",\"molecular_weight\":\"~402 Da (copper complex)\"},\"mechanism\":\"It physically attaches to copper molecules and pulls them into your cells. Once inside, it flips on the genes responsible for making collagen and turns off the genes that cause inflammation and scarring.\",\"studied_for\":[\"Wound healin
