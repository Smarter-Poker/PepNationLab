  <script>
    var m4Correct = { q1: false, q2: false };

    function goM4(page) {
      document.querySelectorAll('.m4-page').forEach(el => el.classList.remove('active'));
      document.getElementById('m4p' + page).classList.add('active');
      window.scrollTo({ top: 0, behavior: "smooth" });
      try { localStorage.setItem("p101_m4_page", page); } catch(e) {}
    }

    function tryGoM4Recap() {
      if (m4Correct.q1 && m4Correct.q2) {
        goM4(6);
      } else {
        showM4Toast(false, 'Answer Both Questions First', 'You must answer both questions correctly to unlock the Recap.');
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      try {
        var p = localStorage.getItem("p101_m4_page");
        if (p && p !== '6') {
          document.querySelectorAll('.m4-page').forEach(el => el.classList.remove('active'));
          var el = document.getElementById('m4p' + p);
          if (el) el.classList.add('active');
        }
      } catch(e) {}
    });

    function checkM4(qClass, isCorrect, el) {
      if (isCorrect) {
        m4Correct[qClass] = true;
        document.querySelectorAll('.' + qClass).forEach(btn => {
          btn.classList.remove('selected', 'wrong-opt');
        });
        el.classList.add('selected');
        
        if (m4Correct.q1 && m4Correct.q2) {
          showM4Toast(true, 'Great Job!', 'You got both questions right! You can now move to the recap.');
        } else {
          showM4Toast(true, 'Correct!', 'Good job, keep going.');
        }
      } else {
        document.querySelectorAll('.' + qClass).forEach(btn => {
          btn.classList.remove('selected', 'wrong-opt');
        });
        el.classList.add('wrong-opt');
        showM4Toast(false, 'Not Quite', 'That is incorrect. Try again!');
        m4Correct[qClass] = false;
      }
    }

    function showM4Toast(isSuccess, title, msg) {
      var toast = document.getElementById('m4-toast');
      var icon = document.getElementById('m4-toast-icon');
      document.getElementById('m4-toast-title').innerText = title;
      document.getElementById('m4-toast-msg').innerText = msg;
      
      if (isSuccess) {
        icon.style.background = 'rgba(16, 185, 129, 0.2)';
        icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        toast.style.border = '1px solid #10b981';
      } else {
        icon.style.background = 'rgba(239, 68, 68, 0.2)';
        icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
        toast.style.border = '1px solid #ef4444';
      }
      
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 3000);
    }
  </script>
