<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #0b1117; display: flex; justify-content: center; padding: 50px; font-family: sans-serif; }
  .metallic-panel {
    width: 480px;
    background: #0f1923;
    border-radius: 12px;
    position: relative;
    padding: 24px;
    box-shadow: 
      0 20px 40px rgba(0,0,0,0.8),
      inset 0 0 0 1px rgba(255,255,255,0.1),
      inset 0 0 0 3px rgba(0,0,0,0.8);
  }
  /* The thick brushed nickel frame via pseudo-element */
  .metallic-panel::before {
    content: "";
    position: absolute;
    top: -12px; left: -12px; right: -12px; bottom: -12px;
    z-index: -1;
    border-radius: 20px;
    background: linear-gradient(135deg, #e6e9ec 0%, #aeb6bf 25%, #6a7683 50%, #909ba7 75%, #d1d6dc 100%);
    box-shadow: 
      inset 0 1px 3px rgba(255,255,255,0.8),
      inset 0 -1px 3px rgba(0,0,0,0.5),
      0 4px 10px rgba(0,0,0,0.6);
    /* simulate brushed texture with a second background layer */
  }
</style>
</head>
<body>
  <div class="metallic-panel">
    <h1 style="color:white">KPI Data</h1>
  </div>
</body>
</html>
