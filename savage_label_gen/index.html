<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 0;
    width: 1024px;
    height: 512px;
    background-image: url('./savage-blank-template.png');
    background-size: 1024px 512px;
    position: relative;
    overflow: hidden;
  }
  
  .metal-text {
    font-family: 'Impact', sans-serif;
    font-style: italic;
    transform: skewX(-8deg);
    text-transform: uppercase;
    text-align: center;
    
    /* Silver gradient to mimic brushed metal */
    background: linear-gradient(
      180deg,
      #EAEAEA 0%,
      #FFFFFF 20%,
      #909090 40%,
      #505050 50%,
      #D0D0D0 60%,
      #FFFFFF 80%,
      #808080 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    
    /* Simulate bevel and drop shadow using multi-layered stroke and shadow */
    filter: drop-shadow(0px 8px 10px rgba(0, 0, 0, 0.9))
            drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.7));
    -webkit-text-stroke: 4px #1A1A1A;
  }

  .title {
    position: absolute;
    bottom: 120px; /* Adjust based on banner */
    width: 1024px;
    font-size: 100px;
    letter-spacing: -2px;
  }
  
  .dose-left {
    position: absolute;
    left: 40px;
    top: 200px;
    font-size: 80px;
    width: 200px;
    text-align: center;
  }
  
  .dose-right {
    position: absolute;
    right: 40px;
    top: 200px;
    font-size: 80px;
    width: 200px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="metal-text dose-left">10MG</div>
  <div class="metal-text title">EPITHALON</div>
  <div class="metal-text dose-right">10MG</div>
</body>
</html>
